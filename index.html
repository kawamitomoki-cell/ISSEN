<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>STICK BRAWL</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    background: #1d2a33; color: #eef3f6;
    font-family: "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
    height: 100%; overflow: hidden; user-select: none; -webkit-user-select: none; touch-action: none;
  }
  body { display: flex; flex-direction: column; align-items: center; padding: env(safe-area-inset-top) 8px env(safe-area-inset-bottom); }
  #bar { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; padding: 8px 4px; gap: 8px; }
  #title { font-weight: 900; font-size: 18px; letter-spacing: 0.5px; }
  #status { font-size: 13px; color: #ffd166; }
  #qr-toggle { background: none; border: 1px solid #5b7383; color: #eef3f6; border-radius: 6px; padding: 4px 10px; font-size: 13px; }
  #wrap { width: 100%; max-width: 800px; border-radius: 10px; overflow: hidden; border: 3px solid #0d1418; }
  #wrap canvas { width: 100% !important; height: auto !important; display: block; }
  #pad { width: 100%; max-width: 800px; display: flex; justify-content: space-between; align-items: center; margin-top: 12px; gap: 12px; }
  #pad .grp { display: flex; gap: 12px; align-items: center; }
  #pad button {
    width: 76px; height: 76px; border-radius: 50%; border: 3px solid #0d1418;
    background: #e8eef2; color: #1d2a33; font-size: 22px; font-weight: 900;
    touch-action: none;
  }
  #pad button.on { background: #ffd166; transform: scale(0.94); }
  #pad #btn-a { width: 92px; height: 92px; font-size: 17px; background: #ef4747; color: #fff; }
  #pad #btn-a.on { background: #ffd166; color: #1d2a33; }
  #pad #btn-j { font-size: 15px; }
  #lobby {
    position: fixed; inset: 0; background: rgba(13, 20, 24, 0.88);
    display: none; align-items: center; justify-content: center; z-index: 10;
  }
  #lobby .card { background: #eef3f6; color: #1d2a33; border-radius: 14px; padding: 20px; text-align: center; width: 290px; display: flex; flex-direction: column; gap: 12px; align-items: center; }
  #room-code { font-size: 34px; font-weight: 900; letter-spacing: 4px; }
  #lobby button { width: 100%; padding: 10px; border-radius: 8px; border: none; font-weight: 700; font-size: 15px; }
  #copy-btn { background: #1d2a33; color: #fff; }
  #close-btn { background: #ffd166; color: #1d2a33; }
  #err { display: none; position: fixed; inset: 0; background: #1d2a33; padding: 24px; font-size: 15px; line-height: 1.7; z-index: 20; }
</style>
</head>
<body>
<div id="bar">
  <div id="title">STICK BRAWL</div>
  <div id="status">接続中...</div>
  <button id="qr-toggle" style="display:none">招待</button>
</div>
<div id="wrap"></div>
<div id="pad">
  <div class="grp">
    <button id="btn-l">◀</button>
    <button id="btn-r">▶</button>
  </div>
  <div class="grp">
    <button id="btn-j">ジャンプ</button>
    <button id="btn-a">攻撃</button>
  </div>
</div>

<div id="lobby">
  <div class="card">
    <div>この部屋に招待</div>
    <div id="room-code"></div>
    <div id="qrcode"></div>
    <button id="copy-btn">参加URLをコピー</button>
    <button id="close-btn">ゲーム画面に戻る</button>
  </div>
</div>
<div id="err"></div>

<script>
// ========================================================
// ① Firebaseの設定
// ========================================================
const firebaseConfig = {
  apiKey: "AIzaSyDLH7pGNXYELET_MTW5EQRJr1XJNE5HZR8",
  authDomain: "stick-fight-bac45.firebaseapp.com",
  databaseURL: "https://stick-fight-bac45-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "stick-fight-bac45",
  storageBucket: "stick-fight-bac45.firebasestorage.app",
  messagingSenderId: "464565244587",
  appId: "1:464565244587:web:1c671b1e1bf47888ebddee"
};

let db;
try {
  firebase.initializeApp(firebaseConfig);
  db = firebase.database();
} catch (e) {
  const el = document.getElementById('err');
  el.style.display = 'block';
  el.innerText = "Firebaseの設定が読み込めませんでした。\n\n" + e.message;
}

// ========================================================
// ② 基本設定
// ========================================================
const W = 800, H = 450, GRAV = 0.6, MAX_STOCK = 3;
const params = new URLSearchParams(location.search);
let roomId = params.get('room');
const isHost = !roomId;
if (isHost) roomId = Math.random().toString(36).slice(2, 7).toUpperCase();
const myId = Math.random().toString(36).slice(2, 10);
const roomRef = db ? db.ref('rooms/' + roomId) : null;

const COLORS = ['#e63946', '#1f8ef1', '#f4a261', '#2a9d8f', '#9b5de5', '#ef476f', '#06d6a0', '#3d405b'];
const platforms = [
  { x: 110, y: 390, w: 580, h: 22 },
  { x: 170, y: 280, w: 150, h: 14 },
  { x: 480, y: 280, w: 150, h: 14 },
  { x: 325, y: 175, w: 150, h: 14 }
];

// 入力：l/r/a は押している間 true、jc/ac/rc は押した・離した回数（取りこぼし防止）
let input = { l: false, r: false, a: false, jc: 0, ac: 0, rc: 0 };
let raw = { j: false, a: false };
let lastSent = '';
let players = {}, targets = {}, hostInputs = {};
let colorCount = 0;
let game = { ph: 'play', w: null, t: 0 };
let events = [], evSeq = 0, lastEv = 0, gotFirst = false;
let myPrev = {};
let particles = [], popups = [], shake = 0, flash = {};
let updatesPerSec = 0, updateCounter = 0;

// ========================================================
// ③ 効果音（Web Audio）
// ========================================================
let actx = null, noiseBuf = null;
function unlockAudio() {
  try {
    if (!actx) {
      actx = new (window.AudioContext || window.webkitAudioContext)();
      const len = actx.sampleRate * 0.6;
      noiseBuf = actx.createBuffer(1, len, actx.sampleRate);
      const d = noiseBuf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
    }
    if (actx.state === 'suspended') actx.resume();
  } catch (e) {}
}
window.addEventListener('pointerdown', unlockAudio);
window.addEventListener('keydown', unlockAudio);

function tone(f1, f2, dur, vol, type) {
  if (!actx) return;
  const t = actx.currentTime, o = actx.createOscillator(), g = actx.createGain();
  o.type = type || 'sine';
  o.frequency.setValueAtTime(f1, t);
  o.frequency.exponentialRampToValueAtTime(Math.max(f2, 1), t + dur);
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(actx.destination);
  o.start(t); o.stop(t + dur);
}
function noiseHit(dur, vol, freq) {
  if (!actx) return;
  const t = actx.currentTime, s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(actx.destination);
  s.start(t); s.stop(t + dur);
}
function sfxHit(p) {
  noiseHit(0.08 + p * 0.012, Math.min(0.25 + p * 0.025, 0.7), 1200 + p * 160);
  tone(220 + p * 12, 50, 0.12 + p * 0.012, 0.3, 'triangle');
}
function sfxKO() {
  noiseHit(0.7, 0.7, 900);
  tone(140, 30, 0.7, 0.5, 'sawtooth');
  tone(1000, 200, 0.35, 0.15, 'square');
}
function sfxJump() { tone(420, 820, 0.08, 0.07, 'sine'); }
function sfxStart() { tone(500, 1000, 0.15, 0.15, 'square'); }

// ========================================================
// ④ p5.js 本体
// ========================================================
function setup() {
  const c = createCanvas(W, H);
  c.parent('wrap');
  textFont('sans-serif');
  if (!db) return;

  const myInputRef = roomRef.child('inputs/' + myId);
  myInputRef.set(input);
  myInputRef.onDisconnect().remove();

  if (isHost) {
    roomRef.child('host').set(myId);
    roomRef.onDisconnect().remove();
    roomRef.child('inputs').on('value', s => { hostInputs = s.val() || {}; });
    setInterval(sendState, 33);   // 1秒に約30回配信
    showLobby();
    document.getElementById('qr-toggle').style.display = 'block';
  } else {
    roomRef.child('state').on('value', s => {
      const v = s.val();
      if (v === null) { setStatus('ホストが見つかりません', '#ff6b6b'); return; }
      targets = v.p || {};
      const gm = v.gm || {};
      game.ph = gm.ph || 'play'; game.w = gm.w || null; game.t = gm.t || 0;
      const evs = v.ev ? Object.values(v.ev).sort((a, b) => a.n - b.n) : [];
      if (!gotFirst) {
        gotFirst = true;
        if (evs.length) lastEv = evs[evs.length - 1].n;
      } else {
        for (const e of evs) if (e.n > lastEv) { lastEv = e.n; handleEvent(e); }
      }
      updateCounter++;
    });
  }
  setInterval(() => { updatesPerSec = updateCounter; updateCounter = 0; }, 1000);
}

function draw() {
  readInput();
  sendInputIfChanged();

  if (isHost) simulate();
  else interpolate();

  for (const k in flash) if (flash[k] > 0) flash[k]--;

  push();
  if (shake > 0) {
    translate(random(-shake, shake), random(-shake, shake));
    shake *= 0.85;
    if (shake < 0.5) shake = 0;
  }
  background('#cfe3ee');

  noStroke();
  fill('#24323c');
  for (const p of platforms) rect(p.x, p.y, p.w, p.h, 4);

  for (const id in players) drawFighter(players[id], id);
  drawParticles();
  drawPopups();
  pop();

  drawHUD();
  if (game.ph === 'end') drawBanner();

  const n = Object.keys(players).length;
  if (isHost) setStatus(`ホスト ・ 部屋 ${roomId} ・ ${n}人`, '#7ee081');
  else if (n > 0) setStatus(`参加中 ・ ${n}人 ・ 受信 ${updatesPerSec}回/秒`, '#7ee081');
}

// ========================================================
// ⑤ キャラの動き（ホストと自分の予測で共通）
// ========================================================
function newFighter(i) {
  return { x: spawnX(i), y: 60, vx: 0, vy: 0, g: false, f: 1, c: COLORS[i % COLORS.length],
           d: 0, s: MAX_STOCK, kb: 0, hs: 0, r: 0, a: 0, ch: 0, pw: 0, cd: 0, inv: 90, jn: 0,
           out: false, hit: {}, pi: {} };
}
function spawnX(i) { return 250 + (i % 4) * 100; }

function stepFighter(p, inp, prev) {
  if (p.out) return;
  if (p.hs > 0) { p.hs--; return; }           // ヒットストップ中は止まる

  const jp = (inp.jc || 0) !== (prev.jc || 0);
  const ap = (inp.ac || 0) !== (prev.ac || 0);
  const ar = (inp.rc || 0) !== (prev.rc || 0);
  if (p.inv > 0) p.inv--;
  if (p.cd > 0) p.cd--;

  if (p.kb > 0) {                               // 吹っ飛び中は操作不能
    p.kb--;
    p.r += p.vx * 0.06 + p.f * 0.05;
    p.vx *= 0.985;
    p.a = 0; p.ch = 0;
  } else {
    p.r *= 0.5;
    const dir = (inp.r ? 1 : 0) - (inp.l ? 1 : 0);
    const slow = p.ch > 0 ? 0.35 : 1;
    p.vx += dir * (p.g ? 1.0 : 0.65) * slow;
    p.vx *= p.g ? 0.80 : 0.90;
    if (dir !== 0 && p.a === 0) p.f = dir;

    if (jp) {
      if (p.g) { p.vy = -12.5; p.g = false; p.jn = 1; }
      else if (p.jn < 2) { p.vy = -11; p.jn = 2; }   // 2段ジャンプ
    }

    if (ap && p.a === 0 && p.cd === 0) p.ch = 1;     // ため開始
    if (p.ch > 0 && inp.a) p.ch = Math.min(p.ch + 1, 60);
    if (ar && p.ch > 0) {                             // 離したら攻撃
      p.pw = p.ch >= 12 ? 0.3 + 0.7 * (p.ch - 12) / 48 : 0;
      p.a = 1; p.ch = 0; p.hit = {};
    }
    if (p.a > 0) {
      p.a++;
      if (p.a === 4 && p.pw > 0) p.vx += p.f * 7 * p.pw;  // スマッシュで前に踏み込む
      if (p.a > 16) { p.a = 0; p.cd = 5; }
    }
  }

  p.vy = Math.min(p.vy + GRAV, 17);
  const prevY = p.y;
  p.x += p.vx;
  p.y += p.vy;
  p.g = false;
  for (const pl of platforms) {
    if (p.vy >= 0 && p.x > pl.x - 6 && p.x < pl.x + pl.w + 6 && prevY <= pl.y && p.y >= pl.y) {
      p.y = pl.y; p.vy = 0; p.g = true; p.jn = 0;
      if (p.kb > 0) { p.kb = Math.min(p.kb, 6); p.vx *= 0.6; }
    }
  }
}

// ========================================================
// ⑥ ホスト：当たり判定・撃墜・ラウンド管理
// ========================================================
function simulate() {
  for (const id in hostInputs) if (!players[id]) players[id] = newFighter(colorCount++);
  for (const id in players) if (!hostInputs[id]) delete players[id];

  if (game.ph === 'end') { game.t--; if (game.t <= 0) resetRound(); }

  for (const id in players) {
    const p = players[id];
    const inp = id === myId ? input : (hostInputs[id] || {});
    const wasStopped = p.hs > 0;
    stepFighter(p, inp, p.pi);
    if (!wasStopped) p.pi = { ...inp };
  }
  for (const id in players) checkHits(id);
  for (const id in players) checkBlast(id);

  if (game.ph === 'play') {
    const ids = Object.keys(players);
    if (ids.length >= 2) {
      const alive = ids.filter(i => !players[i].out);
      if (alive.length <= 1) {
        game.ph = 'end'; game.w = alive[0] || null; game.t = 240;
        pushEvent({ k: 'win', v: game.w || '' });
      }
    }
  }
}

function checkHits(attId) {
  const a = players[attId];
  if (a.out || a.a < 4 || a.a > 9) return;
  const smash = a.pw > 0;
  const hx = a.x + a.f * (smash ? 34 : 28), hy = a.y - 34, R = smash ? 32 : 24;
  for (const id in players) {
    if (id === attId) continue;
    const t = players[id];
    if (t.out || t.inv > 0 || a.hit[id]) continue;
    if (Math.hypot(hx - t.x, hy - (t.y - 30)) < R + 16) {
      a.hit[id] = true;
      t.d += smash ? 10 + a.pw * 12 : 6;
      const kb = (smash ? 8 + a.pw * 9 : 4.5) + t.d * (smash ? 0.10 : 0.05);
      t.vx = a.f * kb;
      t.vy = -kb * 0.6 - 2;
      t.kb = Math.floor(10 + kb * 1.8);
      const stop = Math.min(3 + Math.floor(kb * 0.45), 14);
      t.hs = stop; a.hs = stop;
      t.f = -a.f; t.a = 0; t.ch = 0; t.g = false;
      pushEvent({ k: 'hit', x: Math.round((hx + t.x) / 2), y: Math.round(t.y - 32),
                  p: Math.round(kb * 10) / 10, v: id, c: a.c });
    }
  }
}

function checkBlast(id) {
  const p = players[id];
  if (p.out) return;
  if (p.x < -120 || p.x > W + 120 || p.y > H + 160 || p.y < -300) {
    pushEvent({ k: 'ko', x: Math.round(constrain(p.x, 0, W)), y: Math.round(constrain(p.y, 0, H)), c: p.c, v: id });
    p.s--;
    if (p.s <= 0) { p.out = true; p.x = -999; p.y = -999; }
    else respawn(p, W / 2);
  }
}

function respawn(p, x) {
  p.x = x; p.y = 40; p.vx = 0; p.vy = 0; p.d = 0; p.kb = 0; p.hs = 0;
  p.a = 0; p.ch = 0; p.r = 0; p.inv = 100;
}

function resetRound() {
  let i = 0;
  for (const id in players) {
    const p = players[id];
    p.s = MAX_STOCK; p.out = false;
    respawn(p, spawnX(i++));
  }
  game.ph = 'play'; game.w = null;
  pushEvent({ k: 'start' });
}

function pushEvent(e) {
  e.n = ++evSeq;
  events.push(e);
  if (events.length > 10) events.shift();
  handleEvent(e);
}

function sendState() {
  const out = {};
  const r1 = v => Math.round(v * 10) / 10;
  for (const id in players) {
    const p = players[id];
    out[id] = { x: Math.round(p.x), y: Math.round(p.y), vx: r1(p.vx), vy: r1(p.vy), f: p.f, c: p.c,
                d: Math.round(p.d), s: p.s, kb: p.kb, hs: p.hs, r: Math.round(p.r * 100) / 100,
                a: p.a, ch: p.ch, pw: Math.round(p.pw * 100) / 100, inv: p.inv,
                o: p.out ? 1 : 0, g: p.g ? 1 : 0, jn: p.jn };
  }
  roomRef.child('state').set({ p: out, ev: events, gm: { ph: game.ph, w: game.w || '', t: game.t } });
}

// ========================================================
// ⑦ ゲスト：他人は補間、自分は予測で即反応
// ========================================================
function interpolate() {
  const keys = ['vx', 'vy', 'f', 'c', 'd', 's', 'kb', 'hs', 'r', 'a', 'ch', 'pw', 'inv', 'o', 'g', 'jn'];
  for (const id in targets) {
    const t = targets[id];
    if (id === myId) { predictMe(t); continue; }
    if (!players[id]) players[id] = { ...t };
    const p = players[id];
    p.x = lerp(p.x, t.x, 0.4);
    p.y = lerp(p.y, t.y, 0.4);
    for (const k of keys) p[k] = t[k];
  }
  for (const id in players) if (!targets[id]) delete players[id];
}

function predictMe(t) {
  let p = players[myId];
  if (!p) p = players[myId] = Object.assign({ cd: 0, jn: 0, hit: {} }, t);
  p.d = t.d; p.s = t.s; p.c = t.c; p.inv = t.inv; p.o = t.o; p.out = !!t.o;

  const far = Math.hypot(p.x - t.x, p.y - t.y);
  if (t.kb > 0 || t.hs > 0 || far > 80 || t.o) {
    // 吹っ飛び中・ズレが大きい時はホストに合わせる
    p.x = lerp(p.x, t.x, 0.5); p.y = lerp(p.y, t.y, 0.5);
    p.vx = t.vx; p.vy = t.vy; p.kb = t.kb; p.hs = 0; p.r = t.r;
    p.a = t.a; p.ch = t.ch; p.pw = t.pw; p.g = t.g; p.f = t.f; p.jn = t.jn;
    myPrev = { ...input };
  } else {
    p.kb = 0; p.hs = 0;
    stepFighter(p, input, myPrev);
    myPrev = { ...input };
    if (p.g && t.g && Math.abs(p.vx) < 0.5) {
      p.x = lerp(p.x, t.x, 0.15); p.y = lerp(p.y, t.y, 0.15);
    }
  }
}

// ========================================================
// ⑧ 演出（パーティクル・揺れ・文字）
// ========================================================
function handleEvent(e) {
  if (e.k === 'hit') {
    const n = 8 + Math.floor(e.p);
    burst(e.x, e.y, n, e.p * 0.9, e.c, 9);
    burst(e.x, e.y, Math.floor(n / 2), e.p * 0.7, '#ffffff', 7);
    ring(e.x, e.y, e.p * 0.9, 12);
    shake = Math.max(shake, Math.min(e.p * 0.7, 16));
    flash[e.v] = 6;
    if (e.p >= 13) popups.push({ x: e.x, y: e.y - 20, txt: 'SMASH!', life: 40, max: 40, size: 40, c: '#ffd166' });
    sfxHit(e.p);
  } else if (e.k === 'ko') {
    burst(e.x, e.y, 40, 14, e.c, 14);
    burst(e.x, e.y, 20, 10, '#ffffff', 10);
    ring(e.x, e.y, 20, 22);
    shake = 22;
    popups.push({ x: constrain(e.x, 80, W - 80), y: constrain(e.y, 70, H - 60), txt: 'KO!', life: 50, max: 50, size: 60, c: e.c });
    sfxKO();
  } else if (e.k === 'start') {
    popups.push({ x: W / 2, y: H / 2, txt: 'FIGHT!', life: 50, max: 50, size: 64, c: '#ffd166' });
    sfxStart();
  }
  if (particles.length > 300) particles.splice(0, particles.length - 300);
}

function burst(x, y, n, spd, c, sz) {
  for (let i = 0; i < n; i++) {
    const a = random(TWO_PI), v = random(0.3, 1) * spd;
    particles.push({ x, y, vx: cos(a) * v, vy: sin(a) * v, life: random(16, 30), max: 30, c, s: random(sz * 0.5, sz) });
  }
}
function ring(x, y, vr, life) { particles.push({ ring: true, x, y, r: 4, vr, life, max: life }); }

function drawParticles() {
  for (let i = particles.length - 1; i >= 0; i--) {
    const q = particles[i];
    q.life--;
    const al = 255 * Math.max(q.life / q.max, 0);
    if (q.ring) {
      q.r += q.vr; q.vr *= 0.88;
      noFill(); stroke(255, 255, 255, al); strokeWeight(4);
      circle(q.x, q.y, q.r * 2);
    } else {
      q.x += q.vx; q.y += q.vy; q.vx *= 0.9; q.vy = q.vy * 0.9 + 0.15;
      const c = color(q.c); c.setAlpha(al);
      noStroke(); fill(c); circle(q.x, q.y, q.s);
    }
    if (q.life <= 0) particles.splice(i, 1);
  }
}

function drawPopups() {
  for (let i = popups.length - 1; i >= 0; i--) {
    const q = popups[i];
    q.life--;
    const t = 1 - q.life / q.max;
    const s = q.size * (t < 0.15 ? (t / 0.15) * 1.3 : 1);
    textAlign(CENTER, CENTER); textStyle(BOLD); textSize(Math.max(s, 1));
    stroke('#24323c'); strokeWeight(7); fill(q.c);
    text(q.txt, q.x, q.y - t * 20);
    if (q.life <= 0) popups.splice(i, 1);
  }
}

function dmgColor(d) {
  const w = color(255), y = color(255, 209, 102), r = color(239, 71, 71);
  return d < 60 ? lerpColor(w, y, d / 60) : lerpColor(y, r, Math.min((d - 60) / 80, 1));
}

// ========================================================
// ⑨ 棒人間の描画
// ========================================================
function drawFighter(p, id) {
  if (p.out || p.o) return;

  // 吹っ飛び中の残像
  p.trail = p.trail || [];
  if (p.kb > 0) { p.trail.push({ x: p.x, y: p.y - 30 }); if (p.trail.length > 8) p.trail.shift(); }
  else if (p.trail.length) p.trail.shift();
  noStroke();
  for (let i = 0; i < p.trail.length; i++) {
    const tr = p.trail[i], c = color(p.c);
    c.setAlpha(20 + i * 12); fill(c);
    circle(tr.x, tr.y, 10 + i * 2.5);
  }

  const blink = p.inv > 0 && frameCount % 6 < 3;
  const col = flash[id] > 0 ? '#ffffff' : p.c;
  const walk = p.g ? sin(frameCount * 0.35) * Math.min(Math.abs(p.vx), 4) * 3 : 6;

  push();
  translate(p.x, p.y - 30);
  rotate(p.r || 0);
  if (blink) drawingContext.globalAlpha = 0.35;
  if (p.ch > 0) translate(random(-1.5, 1.5), 0);

  stroke(col); strokeWeight(5); strokeCap(ROUND); noFill();
  line(0, -14, 0, 10);
  line(0, 10, -8 + walk, 30);
  line(0, 10, 8 - walk, 30);

  if (p.a > 0) {
    const active = p.a >= 4 && p.a <= 9;
    const ext = active ? (p.pw > 0 ? 28 : 22) : 10;
    line(0, -8, p.f * ext, -4);
    line(0, -8, -p.f * 10, 2);
    if (active) {
      const R = p.pw > 0 ? 34 : 26;
      noFill(); stroke(255, 255, 255, 220); strokeWeight(p.pw > 0 ? 7 : 4);
      if (p.f > 0) arc(6, -4, R * 2, R * 2, -PI / 2.2, PI / 3);
      else arc(-6, -4, R * 2, R * 2, PI - PI / 3, PI + PI / 2.2);
      noStroke(); fill(col);
      circle(p.f * ext, -4, p.pw > 0 ? 15 : 10);
    }
  } else if (p.ch > 0) {
    line(0, -8, -p.f * 14, -2);
    line(0, -8, -p.f * 10, 4);
    noStroke(); fill(255, 220, 80, 90 + p.ch * 2);
    circle(-p.f * 14, -2, 10 + p.ch * 0.6);
  } else if (p.kb > 0) {
    line(0, -8, -12, -20);
    line(0, -8, 12, -20);
  } else {
    line(0, -8, p.f * 14, 2 - walk * 0.4);
    line(0, -8, -p.f * 12, 4);
  }
  noStroke(); fill(col);
  circle(0, -24, 20);
  pop();

  textAlign(CENTER, CENTER); textStyle(BOLD); textSize(14);
  stroke('#24323c'); strokeWeight(3); fill(dmgColor(p.d));
  text(`${Math.round(p.d)}%`, p.x, p.y - 72);
  if (id === myId) {
    noStroke(); fill('#24323c');
    triangle(p.x - 6, p.y - 92, p.x + 6, p.y - 92, p.x, p.y - 84);
  }
}

// ========================================================
// ⑩ HUD・勝利画面
// ========================================================
function drawHUD() {
  let i = 0;
  for (const id in players) {
    const p = players[id];
    const x = 10 + i * 98, y = 8;
    noStroke(); fill(36, 50, 60, 210); rect(x, y, 90, 38, 8);
    fill(p.c); circle(x + 14, y + 19, 14);
    fill(dmgColor(p.d)); textAlign(LEFT, CENTER); textStyle(BOLD); textSize(17);
    text(`${Math.round(p.d)}%`, x + 26, y + 14);
    for (let k = 0; k < MAX_STOCK; k++) {
      fill(k < p.s ? p.c : 'rgba(255,255,255,0.15)');
      circle(x + 31 + k * 12, y + 29, 7);
    }
    if (id === myId) { noFill(); stroke(255); strokeWeight(2); rect(x, y, 90, 38, 8); }
    i++;
  }
}

function drawBanner() {
  noStroke(); fill(13, 20, 24, 160); rect(0, H / 2 - 60, W, 120);
  const wp = game.w ? players[game.w] : null;
  textAlign(CENTER, CENTER); textStyle(BOLD); textSize(54);
  stroke(255); strokeWeight(4); fill(wp ? wp.c : '#ffffff');
  text(!wp ? 'DRAW' : (game.w === myId ? 'YOU WIN!' : 'WINNER!'), W / 2, H / 2 - 12);
  noStroke(); fill(255); textSize(16);
  text(`次のラウンドまで ${Math.max(0, Math.ceil(game.t / 60))}`, W / 2, H / 2 + 36);
}

// ========================================================
// ⑪ 入力（キーボード＋タッチ）
// ========================================================
const touch = { l: false, r: false, j: false, a: false };

function readInput() {
  const j = touch.j || keyIsDown(87) || keyIsDown(UP_ARROW) || keyIsDown(32);
  const a = touch.a || keyIsDown(74) || keyIsDown(75);
  input.l = touch.l || keyIsDown(65) || keyIsDown(LEFT_ARROW);
  input.r = touch.r || keyIsDown(68) || keyIsDown(RIGHT_ARROW);
  if (j && !raw.j) { input.jc++; sfxJump(); }
  if (a && !raw.a) input.ac++;
  if (!a && raw.a) input.rc++;
  input.a = a;
  raw.j = j; raw.a = a;
}

function sendInputIfChanged() {
  if (!roomRef) return;
  const s = JSON.stringify(input);
  if (s !== lastSent) {
    lastSent = s;
    roomRef.child('inputs/' + myId).set(input);
  }
}

function bindButton(id, key) {
  const b = document.getElementById(id);
  const on = e => { e.preventDefault(); touch[key] = true; b.classList.add('on'); };
  const off = e => { e.preventDefault(); touch[key] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('pointerleave', off);
}
bindButton('btn-l', 'l');
bindButton('btn-r', 'r');
bindButton('btn-j', 'j');
bindButton('btn-a', 'a');

// ========================================================
// ⑫ 招待画面
// ========================================================
function showLobby() {
  const url = location.href.split('?')[0] + '?room=' + roomId;
  document.getElementById('room-code').innerText = roomId;
  const q = document.getElementById('qrcode');
  if (!q.hasChildNodes()) new QRCode(q, { text: url, width: 160, height: 160 });
  document.getElementById('lobby').style.display = 'flex';
  document.getElementById('copy-btn').onclick = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(url).then(() => alert('参加URLをコピーしました'));
    else prompt('このURLを送ってください', url);
  };
}
document.getElementById('close-btn').onclick = () => { document.getElementById('lobby').style.display = 'none'; };
document.getElementById('qr-toggle').onclick = showLobby;

function setStatus(t, c) {
  const el = document.getElementById('status');
  el.innerText = t; el.style.color = c;
}
