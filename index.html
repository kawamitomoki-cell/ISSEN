<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>一閃 極 - ISSEN KIWAMI -</title>

  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0a0a0c">

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      background: #0a0a0c;
      color: #f8fafc;
      font-family: 'Hiragino Mincho ProN', 'Yu Mincho', serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      min-height: 100vh;
      overflow: hidden;
      user-select: none;
      touch-action: none;
      padding: 6px;
    }

    #ui-bar {
      width: 100%;
      max-width: 720px;
      background: #141419;
      padding: 8px 16px;
      border-radius: 6px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 6px;
      border: 1px solid #27272a;
    }
    .logo { font-size: 16px; font-weight: bold; letter-spacing: 2px; color: #ef4444; }
    .logo span { color: #f8fafc; font-size: 12px; margin-left: 6px; font-family: sans-serif; }
    #status-text { font-size: 12px; font-weight: bold; color: #facc15; font-family: sans-serif; }

    #canvas-container {
      border: 2px solid #3f3f46;
      border-radius: 6px;
      overflow: hidden;
      box-shadow: 0 0 35px rgba(239, 68, 68, 0.2);
      position: relative;
    }

    /* スマホ操作ボタン群 */
    #mobile-controller {
      display: none;
      width: 100%;
      max-width: 720px;
      margin-top: 8px;
      justify-content: space-between;
      gap: 8px;
      padding: 0 6px;
    }
    .ctrl-group { display: flex; gap: 6px; }
    .btn-touch {
      background: #27272a;
      color: #fff;
      border: 2px solid #52525b;
      border-radius: 8px;
      font-size: 14px;
      font-weight: bold;
      padding: 14px 16px;
      touch-action: manipulation;
      cursor: pointer;
      user-select: none;
      -webkit-user-select: none;
    }
    .btn-touch:active { background: #52525b; transform: scale(0.95); }
    .btn-slash { background: #991b1b; border-color: #ef4444; }
    .btn-parry { background: #1e3a8a; border-color: #3b82f6; }
    .btn-kick  { background: #854d0e; border-color: #eab308; }
    .btn-ult   { background: #581c87; border-color: #a855f7; }

    /* モーダル基本スタイル */
    .modal {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(10, 10, 12, 0.95);
      border-radius: 10px;
      padding: 22px 28px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
      box-shadow: 0 0 50px rgba(0,0,0,0.9);
      z-index: 100;
      text-align: center;
    }

    .modal-btn {
      background: #dc2626;
      color: white;
      border: none;
      padding: 10px 24px;
      border-radius: 4px;
      font-weight: bold;
      cursor: pointer;
      font-size: 14px;
      letter-spacing: 1px;
      width: 100%;
      transition: background 0.2s;
    }
    .modal-btn:hover { background: #b91c1c; }
    .modal-btn.secondary { background: #27272a; border: 1px solid #52525b; }
    .modal-btn.secondary:hover { background: #3f3f46; }

    #guide-text { font-size: 11px; color: #a1a1aa; margin-top: 6px; font-family: sans-serif; text-align: center; }
  </style>
</head>
<body>

  <div id="ui-bar">
    <div class="logo">一 閃<span>極 - KIWAMI -</span></div>
    <div id="status-text">対戦モードを選択してください</div>
  </div>

  <div id="canvas-container"></div>
  <div id="guide-text">操作: <strong>A/D</strong> 移動 | <strong>J</strong> 斬撃 | <strong>K</strong> 見切り(パリィ) | <strong>L</strong> 崩し蹴り | <strong>U</strong> 奥義</div>

  <!-- スマホ用コントローラー -->
  <div id="mobile-controller">
    <div class="ctrl-group">
      <button class="btn-touch" id="btn-left">◀</button>
      <button class="btn-touch" id="btn-right">▶</button>
    </div>
    <div class="ctrl-group">
      <button class="btn-touch btn-kick" id="btn-kick">崩し</button>
      <button class="btn-touch btn-parry" id="btn-parry">見切</button>
      <button class="btn-touch btn-slash" id="btn-slash">一閃</button>
      <button class="btn-touch btn-ult" id="btn-ult">奥義</button>
    </div>
  </div>

  <!-- タイトル & モード選択画面 -->
  <div class="modal" id="mode-modal">
    <h2 style="color:#ef4444; font-size: 26px; letter-spacing: 4px;">一 閃 極</h2>
    <p style="font-size: 12px; color: #a1a1aa; font-family: sans-serif;">― 研ぎ澄まされた刃が交錯する瞬刻 ―</p>
    <div style="display:flex; flex-direction:column; gap:10px; width:220px; margin-top:10px;">
      <button class="modal-btn" id="start-cpu-btn">一人で修練 (CPU戦)</button>
      <button class="modal-btn secondary" id="start-online-btn">二人で決闘 (オンライン)</button>
    </div>
  </div>

  <!-- QR招待画面 -->
  <div class="modal" id="qr-modal" style="display: none; border: 2px solid #ef4444;">
    <h3 style="color:#ef4444; font-size: 16px;">対戦相手を招待</h3>
    <div id="qrcode" style="background:#fff; padding:6px; border-radius:4px;"></div>
    <button class="modal-btn" id="copy-url-btn">対戦URLをコピー</button>
    <div style="font-size: 11px; color:#a1a1aa; font-family: sans-serif;">カメラをかざすとスマホが刀になります</div>
  </div>

  <!-- 決着画面 -->
  <div class="modal" id="gameover-modal" style="display: none; border: 2px solid #eab308;">
    <h2 id="winner-text" style="font-size: 30px; letter-spacing: 4px;">勝負あり</h2>
    <div id="round-score" style="font-size: 14px; color:#cbd5e1; font-family: sans-serif;"></div>
    <button class="modal-btn" id="rematch-btn">再戦する</button>
    <button class="modal-btn secondary" id="title-return-btn">モード選択へ戻る</button>
  </div>

  <script>
    // ========================================================
    // サウンドエンジン (Web Audio API)
    // ========================================================
    let audioCtx = null;
    function getAudio() {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    }

    function soundSlash() {
      let ctx = getAudio();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(850, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(100, ctx.currentTime + 0.16);
      gain.gain.setValueAtTime(0.35, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.16);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.16);
    }

    function soundKick() {
      let ctx = getAudio();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(250, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(60, ctx.currentTime + 0.2);
      gain.gain.setValueAtTime(0.5, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.2);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.2);
    }

    function soundParry() {
      let ctx = getAudio();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1500, ctx.currentTime);
      osc.frequency.setValueAtTime(2400, ctx.currentTime + 0.04);
      gain.gain.setValueAtTime(0.6, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.35);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.35);
    }

    function soundUlt() {
      let ctx = getAudio();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(120, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(1800, ctx.currentTime + 0.3);
      gain.gain.setValueAtTime(0.4, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.3);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.3);
    }

    function soundKill() {
      let ctx = getAudio();
      let osc = ctx.createOscillator();
      let gain = ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(160, ctx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(30, ctx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.9, ctx.currentTime);
      gain.gain.linearRampToValueAtTime(0, ctx.currentTime + 0.5);
      osc.connect(gain); gain.connect(ctx.destination);
      osc.start(); osc.stop(ctx.currentTime + 0.5);
    }

    // ========================================================
    // ゲームパラメータ & 設計
    // ========================================================
    const GAME_W = 700;
    const GAME_H = 340;
    const FLOOR_Y = 275;

    let gameMode = "none"; // "cpu", "online", "none"
    let role = "unknown";  // "host", "guest", "offline"
    let conn = null;
    let peer = null;

    let shakeFrames = 0;
    let hitStopFrames = 0;
    let slowMoTimer = 0;
    let darkScreenFrames = 0;
    let particles = [];
    let slashes = [];
    let ghosts = []; // 残像

    function createPlayer(x, dir, scarfColor, name) {
      return {
        x: x,
        y: FLOOR_Y,
        dir: dir,
        scarfColor: scarfColor,
        name: name,
        state: "idle", // idle, moving, slash, parry, kick, ult, stunned, dead
        timer: 0,
        score: 0,
        gauge: 0, // 0 - 100
        vx: 0
      };
    }

    let p1 = createPlayer(180, 1, '#ef4444', '壱P (赤)');
    let p2 = createPlayer(520, -1, '#38bdf8', '弐P (青)');
    let isGameOver = false;

    // スマホ入力フラグ
    let inputLeft = false, inputRight = false;

    // CPU思考用タイマー
    let cpuThinkTimer = 0;
    let cpuAction = "idle";

    function setup() {
      let canvas = createCanvas(GAME_W, GAME_H);
      canvas.parent('canvas-container');
      setupUIEvents();
      setupMobileControls();

      // URLに ?room= があれば自動でゲスト参加
      const urlParams = new URLSearchParams(window.location.search);
      if (urlParams.get('room')) {
        document.getElementById('mode-modal').style.display = 'none';
        initNetworkOnline();
      }
    }

    function draw() {
      if (hitStopFrames > 0) {
        hitStopFrames--;
        return;
      }

      if (slowMoTimer > 0) {
        slowMoTimer--;
        if (frameCount % 3 !== 0) return;
      }

      push();
      if (shakeFrames > 0) {
        translate(random(-8, 8), random(-8, 8));
        shakeFrames--;
      }

      // 暗転演出（奥義発動時）
      if (darkScreenFrames > 0) {
        background(5, 5, 8);
        darkScreenFrames--;
      } else {
        background(15, 15, 20);
        drawStage();
      }

      if (gameMode !== "none") {
        handleInput();

        if (gameMode === "cpu") {
          updateCPU();
          updatePlayer(p1);
          updatePlayer(p2);
          checkCombat(p1, p2);
          checkCombat(p2, p1);
        } else if (role === "host") {
          updatePlayer(p1);
          updatePlayer(p2);
          checkCombat(p1, p2);
          checkCombat(p2, p1);

          if (conn && conn.open) {
            conn.send({
              t: 'sync',
              p1: serializeP(p1),
              p2: serializeP(p2),
              slashes: slashes,
              shake: shakeFrames > 0,
              dark: darkScreenFrames > 0
            });
          }
        }
      }

      updateEffects();

      drawGhosts();
      drawStickman(p1);
      drawStickman(p2);

      drawBattleUI();

      pop();
    }

    function serializeP(p) {
      return { x: Math.round(p.x), dir: p.dir, state: p.state, score: p.score, gauge: p.gauge };
    }

    // ========================================================
    // 入力・アクション・3すくみ判定
    // ========================================================
    function handleInput() {
      let my = (role === "guest") ? p2 : p1;
      if (my.state === "dead" || my.state === "stunned" || isGameOver) return;

      let left = keyIsDown(65) || keyIsDown(LEFT_ARROW) || inputLeft;
      let right = keyIsDown(68) || keyIsDown(RIGHT_ARROW) || inputRight;

      if (my.state === "idle" || my.state === "moving") {
        if (left) {
          my.x -= 4; my.dir = -1; my.state = "moving";
          addGhost(my);
        } else if (right) {
          my.x += 4; my.dir = 1; my.state = "moving";
          addGhost(my);
        } else {
          my.state = "idle";
        }
        my.x = constrain(my.x, 50, GAME_W - 50);
      }

      if (role === "guest" && conn && conn.open) {
        conn.send({ t: 'input', left: left, right: right });
      }
    }

    function triggerAction(player, action) {
      if (player.state === "dead" || player.state === "stunned" || isGameOver) return;
      if (player.state !== "idle" && player.state !== "moving") return;

      if (action === "slash") {
        player.state = "slash";
        player.timer = 18;
        player.vx = player.dir * 13;
        soundSlash();
        slashes.push({ x: player.x, y: player.y - 45, dir: player.dir, life: 14, color: '#fef08a' });
        addGhost(player);
      } else if (action === "parry") {
        player.state = "parry";
        player.timer = 20;
      } else if (action === "kick") {
        player.state = "kick";
        player.timer = 22;
        player.vx = player.dir * 6;
        soundKick();
        addGhost(player);
      } else if (action === "ult") {
        if (player.gauge >= 100) {
          player.gauge = 0;
          player.state = "ult";
          player.timer = 26;
          player.vx = player.dir * 24; // 超長距離ダッシュ
          soundUlt();
          darkScreenFrames = 25;
          shakeFrames = 20;
          slashes.push({ x: player.x, y: player.y - 45, dir: player.dir, life: 25, color: '#c084fc', wide: true });
        }
      }
    }

    function keyPressed() {
      let my = (role === "guest") ? p2 : p1;
      let act = null;
      if (keyCode === 74) act = "slash"; // J
      if (keyCode === 75) act = "parry"; // K
      if (keyCode === 76) act = "kick";  // L
      if (keyCode === 85) act = "ult";   // U

      if (act) {
        if (role === "guest") conn && conn.send({ t: 'action', a: act });
        else triggerAction(p1, act);
      }
    }

    // ========================================================
    // 戦闘判定（3すくみロジック）
    // ========================================================
    function updatePlayer(p) {
      if (p.timer > 0) {
        p.timer--;
        if (p.state === "slash" || p.state === "kick" || p.state === "ult") {
          p.x += p.vx;
          p.vx *= 0.85;
          p.x = constrain(p.x, 50, GAME_W - 50);
        }
        if (p.timer <= 0) p.state = "idle";
      }
    }

    function checkCombat(att, def) {
      if (def.state === "dead") return;
      let dist = (def.x - att.x) * att.dir;

      // 1. 奥義（全技に勝つ必殺技）
      if (att.state === "ult" && att.timer > 8 && dist > 0 && dist < 150) {
        killPlayer(att, def, true);
        return;
      }

      // 2. 斬撃の当たり判定
      if (att.state === "slash" && att.timer >= 8 && att.timer <= 15) {
        if (dist > 0 && dist < 95) {
          // 【見切りに弾かれる】
          if (def.state === "parry") {
            att.state = "stunned";
            att.timer = 50;
            att.vx = -att.dir * 8;
            def.gauge = min(100, def.gauge + 35); // パリィ成功で奥義ゲージ大幅増
            soundParry();
            shakeFrames = 15;
            hitStopFrames = 6;
            createSparks((att.x + def.x) / 2, FLOOR_Y - 45);
            return;
          }
          // 【相打ち鍔迫り合い】
          if (def.state === "slash") {
            att.state = "stunned"; att.timer = 20; att.vx = -att.dir * 6;
            def.state = "stunned"; def.timer = 20; def.vx = -def.dir * 6;
            soundParry();
            shakeFrames = 12;
            createSparks((att.x + def.x) / 2, FLOOR_Y - 45);
            return;
          }
          // 【一刀両断】
          killPlayer(att, def, false);
          return;
        }
      }

      // 3. 崩し蹴りの当たり判定
      if (att.state === "kick" && att.timer >= 10 && att.timer <= 18) {
        if (dist > 0 && dist < 75) {
          if (def.state === "parry") {
            // パリィ構えを蹴り崩して大スタン！
            def.state = "stunned";
            def.timer = 65;
            def.vx = att.dir * 9;
            soundKick();
            shakeFrames = 12;
            hitStopFrames = 5;
            att.gauge = min(100, att.gauge + 25);
            return;
          }
        }
      }
    }

    function killPlayer(att, def, isUlt) {
      def.state = "dead";
      att.score++;
      soundKill();
      shakeFrames = isUlt ? 35 : 22;
      hitStopFrames = isUlt ? 16 : 10;
      slowMoTimer = 45;
      createBlood(def.x, FLOOR_Y - 45, att.dir);

      setTimeout(() => {
        if (att.score >= 3) endGame();
        else resetRound();
      }, 1600);
    }

    function resetRound() {
      p1.x = 180; p1.dir = 1; p1.state = "idle"; p1.timer = 0;
      p2.x = 520; p2.dir = -1; p2.state = "idle"; p2.timer = 0;
    }

    // ========================================================
    // CPU思考ロジック (修練モード)
    // ========================================================
    function updateCPU() {
      if (p2.state === "dead" || p2.state === "stunned" || isGameOver) return;
      cpuThinkTimer--;

      let dist = p1.x - p2.x;
      p2.dir = dist > 0 ? 1 : -1;
      let absDist = abs(dist);

      if (cpuThinkTimer <= 0) {
        cpuThinkTimer = floor(random(15, 35));

        // プレイヤーの行動へのリアクション
        if (p1.state === "slash" && absDist < 120) {
          // 相手が斬ってきたら70%でパリィを試みる
          if (random() < 0.7) triggerAction(p2, "parry");
        } else if (p1.state === "parry" && absDist < 90) {
          // 相手が構えていたら崩し蹴りを入れる
          triggerAction(p2, "kick");
        } else if (p2.gauge >= 100 && absDist < 200) {
          // 奥義
          triggerAction(p2, "ult");
        } else {
          // 距離に応じた立ち回り
          if (absDist > 140) {
            p2.x += p2.dir * 4; p2.state = "moving";
            addGhost(p2);
          } else if (absDist < 85) {
            if (random() < 0.5) triggerAction(p2, "slash");
            else triggerAction(p2, "kick");
          } else {
            if (random() < 0.3) triggerAction(p2, "slash");
            else p2.state = "idle";
          }
        }
        p2.x = constrain(p2.x, 50, GAME_W - 50);
      }
    }

    // ========================================================
    // 描画エンジン
    // ========================================================
    function drawStage() {
      noStroke();
      fill(185, 28, 28, 40);
      ellipse(width / 2, 110, 160, 160); // 紅い月

      stroke(82, 82, 91);
      strokeWeight(3);
      line(30, FLOOR_Y, width - 30, FLOOR_Y); // 足場
    }

    function addGhost(p) {
      if (frameCount % 2 === 0) {
        ghosts.push({ x: p.x, dir: p.dir, state: p.state, scarfColor: p.scarfColor, life: 10 });
      }
    }

    function drawGhosts() {
      for (let i = ghosts.length - 1; i >= 0; i--) {
        let g = ghosts[i];
        push();
        translate(g.x, FLOOR_Y);
        scale(g.dir, 1);
        stroke(255, 255, 255, g.life * 15);
        strokeWeight(3);
        noFill();
        ellipse(0, -70, 18, 18);
        line(0, -55, 0, -28);
        pop();
        g.life--;
        if (g.life <= 0) ghosts.splice(i, 1);
      }
    }

    function drawStickman(p) {
      push();
      translate(p.x, p.y);
      scale(p.dir, 1);

      stroke(248, 250, 252);
      strokeWeight(4);
      strokeCap(ROUND);
      noFill();

      let headY = -70;
      let bodyTopY = -55;
      let hipY = -28;

      if (p.state === "dead") {
        rotate(HALF_PI * 0.9);
        ellipse(0, -20, 16, 16);
        line(0, -10, 0, 30);
      } else if (p.state === "parry") {
        ellipse(0, headY, 18, 18);
        line(0, bodyTopY, 0, hipY);
        line(0, hipY, -10, 0); line(0, hipY, 12, 0);
        stroke('#38bdf8');
        line(0, -45, 14, -48);
        strokeWeight(5); line(14, -20, 14, -75);
      } else if (p.state === "kick") {
        ellipse(-5, headY + 5, 18, 18);
        line(-5, bodyTopY, 0, hipY);
        line(0, hipY, -15, 0);
        stroke('#eab308');
        line(0, hipY, 28, -25); // 前蹴り
      } else if (p.state === "slash" || p.state === "ult") {
        ellipse(10, headY + 10, 18, 18);
        line(5, bodyTopY + 10, -5, hipY + 5);
        line(-5, hipY + 5, -24, 0); line(-5, hipY + 5, 26, 0);
        stroke(p.state === "ult" ? '#c084fc' : '#ef4444');
        line(5, -35, 30, -35);
        strokeWeight(5); line(30, -35, 60, -25);
      } else if (p.state === "stunned") {
        ellipse(-8, headY + 5, 18, 18);
        line(-6, bodyTopY, -2, hipY);
        line(-2, hipY, -14, 0); line(-2, hipY, 6, 0);
        fill('#facc15'); noStroke();
        ellipse(random(-12, -4), headY - 12, 4, 4);
      } else {
        let bob = sin(frameCount * 0.15) * 2;
        ellipse(0, headY + bob, 18, 18);
        line(0, bodyTopY + bob, 0, hipY);
        if (p.state === "moving") {
          let leg = sin(frameCount * 0.3) * 12;
          line(0, hipY, leg, 0); line(0, hipY, -leg, 0);
        } else {
          line(0, hipY, -8, 0); line(0, hipY, 8, 0);
        }
        stroke(161, 161, 170); strokeWeight(3);
        line(-6, -32 + bob, 16, -24 + bob);
      }

      // マフラー
      stroke(p.scarfColor);
      strokeWeight(4);
      let wave = sin(frameCount * 0.2) * 5;
      line(0, bodyTopY + 2, -18, bodyTopY + 8 + wave);
      line(-18, bodyTopY + 8 + wave, -30, bodyTopY + 6 + wave * 1.5);

      pop();
    }

    function drawBattleUI() {
      textAlign(CENTER, TOP);
      textSize(20);
      noStroke();

      // P1 UI
      fill('#ef4444');
      text(`${p1.name} : ${"●".repeat(p1.score)}${"○".repeat(3 - p1.score)}`, width / 2 - 160, 15);
      drawGauge(width / 2 - 230, 42, p1.gauge);

      // P2 UI
      fill('#38bdf8');
      text(`${p2.name} : ${"●".repeat(p2.score)}${"○".repeat(3 - p2.score)}`, width / 2 + 160, 15);
      drawGauge(width / 2 + 90, 42, p2.gauge);
    }

    function drawGauge(x, y, val) {
      stroke('#3f3f46');
      strokeWeight(1);
      fill('#18181b');
      rect(x, y, 140, 8, 4);
      noStroke();
      fill(val >= 100 ? '#a855f7' : '#38bdf8');
      rect(x, y, (val / 100) * 140, 8, 4);
    }

    // ========================================================
    // エフェクト更新
    // ========================================================
    function createSparks(x, y) {
      for (let i = 0; i < 22; i++) {
        let a = random(TWO_PI);
        let s = random(5, 14);
        particles.push({ x: x, y: y, vx: cos(a) * s, vy: sin(a) * s, life: 18, color: '#facc15' });
      }
    }

    function createBlood(x, y, dir) {
      for (let i = 0; i < 35; i++) {
        let a = random(-PI/3, PI/3) + (dir > 0 ? 0 : PI);
        let s = random(6, 16);
        particles.push({ x: x, y: y, vx: cos(a) * s, vy: sin(a) * s - random(1, 4), life: 30, color: '#dc2626' });
      }
    }

    function updateEffects() {
      for (let i = slashes.length - 1; i >= 0; i--) {
        let s = slashes[i];
        push();
        stroke(s.color);
        strokeWeight(s.life * (s.wide ? 1.6 : 0.9));
        noFill();
        arc(s.x + s.dir * 30, s.y, s.wide ? 180 : 110, 80, -HALF_PI, HALF_PI);
        pop();
        s.life--;
        if (s.life <= 0) slashes.splice(i, 1);
      }

      for (let i = particles.length - 1; i >= 0; i--) {
        let p = particles[i];
        p.x += p.vx; p.y += p.vy; p.vy += 0.4;
        noStroke(); fill(p.color);
        ellipse(p.x, p.y, p.life * 0.25);
        p.life--;
        if (p.life <= 0) particles.splice(i, 1);
      }
    }

    // ========================================================
    // モード切替 ＆ ネットワーク
    // ========================================================
    function setupUIEvents() {
      // CPU戦開始
      document.getElementById('start-cpu-btn').onclick = () => {
        gameMode = "cpu";
        role = "offline";
        p2.name = "CPU (青)";
        document.getElementById('mode-modal').style.display = 'none';
        document.getElementById('status-text').innerText = "● 修練中 (VS CPU)";
        document.getElementById('status-text').style.color = "#4ade80";
      };

      // オンライン戦開始
      document.getElementById('start-online-btn').onclick = () => {
        gameMode = "online";
        document.getElementById('mode-modal').style.display = 'none';
        initNetworkOnline();
      };

      // タイトルへ戻る
      document.getElementById('title-return-btn').onclick = () => {
        window.location.href = window.location.href.split('?')[0];
      };
    }

    function endGame() {
      isGameOver = true;
      let winText = "";
      if (p1.score >= 3) winText = (role === "guest") ? "無念... 敗北" : "見事！ 貴殿の勝利";
      else winText = (role === "guest") ? "見事！ 貴殿の勝利" : "無念... 敗北";

      document.getElementById('winner-text').innerText = winText;
      document.getElementById('winner-text').style.color = winText.includes("勝利") ? "#4ade80" : "#ef4444";
      document.getElementById('round-score').innerText = `最終戦績: ${p1.score} 本 - ${p2.score} 本`;
      document.getElementById('gameover-modal').style.display = 'flex';
    }

    document.getElementById('rematch-btn').onclick = () => {
      p1.score = 0; p2.score = 0; p1.gauge = 0; p2.gauge = 0;
      isGameOver = false;
      document.getElementById('gameover-modal').style.display = 'none';
      resetRound();
      if (role === "host" && conn) conn.send({ t: 'rematch' });
    };

    function initNetworkOnline() {
      const urlParams = new URLSearchParams(window.location.search);
      const targetRoom = urlParams.get('room');

      peer = new Peer({
        config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }, { urls: 'stun:stun1.l.google.com:19302' }] }
      });

      peer.on('open', (myId) => {
        if (targetRoom) {
          role = "guest";
          gameMode = "online";
          document.getElementById('status-text').innerText = "対戦部屋へ接続中...";
          document.getElementById('mobile-controller').style.display = 'flex';
          conn = peer.connect(targetRoom, { reliable: false });
          setupGuest();
        } else {
          role = "host";
          gameMode = "online";
          document.getElementById('status-text').innerText = "対戦相手を待機中...";
          const joinUrl = window.location.href.split('?')[0] + '?room=' + myId;

          new QRCode(document.getElementById("qrcode"), { text: joinUrl, width: 140, height: 140 });
          document.getElementById('qr-modal').style.display = 'flex';

          document.getElementById('copy-url-btn').onclick = () => {
            navigator.clipboard.writeText(joinUrl).then(() => alert("対戦URLをコピーしました！"));
          };

          peer.on('connection', (c) => {
            conn = c;
            setupHost();
          });
        }
      });
    }

    function setupHost() {
      conn.on('open', () => {
        document.getElementById('qr-modal').style.display = 'none';
        document.getElementById('status-text').innerText = "● 決闘中 (貴殿: 壱P 赤)";
        document.getElementById('status-text').style.color = "#4ade80";
      });

      conn.on('data', (d) => {
        if (d.t === 'input') {
          if (p2.state === "idle" || p2.state === "moving") {
            if (d.left) { p2.x -= 4; p2.dir = -1; p2.state = "moving"; addGhost(p2); }
            else if (d.right) { p2.x += 4; p2.dir = 1; p2.state = "moving"; addGhost(p2); }
            else { p2.state = "idle"; }
            p2.x = constrain(p2.x, 50, GAME_W - 50);
          }
        } else if (d.t === 'action') {
          triggerAction(p2, d.a);
        }
      });
    }

    function setupGuest() {
      conn.on('open', () => {
        document.getElementById('status-text').innerText = "● 決闘中 (貴殿: 弐P 青)";
        document.getElementById('status-text').style.color = "#4ade80";
      });

      conn.on('data', (d) => {
        if (d.t === 'sync') {
          p1.x = d.p1.x; p1.dir = d.p1.dir; p1.state = d.p1.state; p1.score = d.p1.score; p1.gauge = d.p1.gauge;
          p2.x = d.p2.x; p2.dir = d.p2.dir; p2.state = d.p2.state; p2.score = d.p2.score; p2.gauge = d.p2.gauge;
          if (d.shake) shakeFrames = 5;
          if (d.dark) darkScreenFrames = 5;
        } else if (d.t === 'rematch') {
          p1.score = 0; p2.score = 0; p1.gauge = 0; p2.gauge = 0;
          isGameOver = false;
          document.getElementById('gameover-modal').style.display = 'none';
          resetRound();
        }
      });
    }

    function setupMobileControls() {
      const bind = (id, onDown, onUp) => {
        let el = document.getElementById(id);
        el.addEventListener('touchstart', (e) => { e.preventDefault(); onDown(); });
        el.addEventListener('touchend', (e) => { e.preventDefault(); onUp(); });
        el.addEventListener('mousedown', onDown);
        el.addEventListener('mouseup', onUp);
      };

      bind('btn-left', () => inputLeft = true, () => inputLeft = false);
      bind('btn-right', () => inputRight = true, () => inputRight = false);

      const trigger = (act) => {
        if (role === "guest") conn && conn.send({ t: 'action', a: act });
        else triggerAction(p1, act);
      };

      document.getElementById('btn-slash').onclick = () => trigger('slash');
      document.getElementById('btn-parry').onclick = () => trigger('parry');
      document.getElementById('btn-kick').onclick  = () => trigger('kick');
      document.getElementById('btn-ult').onclick   = () => trigger('ult');
    }
  </script>
</body>
</html>
